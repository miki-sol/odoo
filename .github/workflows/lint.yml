name: lint

on:
  push:
    branches: [19.0]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed Python files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
          else
              # on push: compare against previous commit
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              # fallback when before is all zeros (new branch / first push)
              if [ "$base" = "0000000000000000000000000000000000000000" ]; then
                  base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
              fi
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" "$head" -- '*.py' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Changed .py files: $files"

      - name: Set up Python
        if: steps.changed.outputs.files != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        if: steps.changed.outputs.files != ''
        run: pip install ruff==0.15.0

      - name: Run ruff
        if: steps.changed.outputs.files != ''
        run: ruff check ${{ steps.changed.outputs.files }}

      - name: Syntax check (compileall)
        if: steps.changed.outputs.files != ''
        run: python -m compileall -q ${{ steps.changed.outputs.files }}

      - name: Nothing to lint
        if: steps.changed.outputs.files == ''
        run: echo "No Python files changed — skipping lint."
